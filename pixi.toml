[workspace]
name = "xview"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = ">=25"
pyqt = ">=5.15,<6"
setuptools = ">=77"
setuptools-scm = ">=8"
python-build = ">=1.2,<2"

[pypi-dependencies]
xview = { path = ".", editable = true, extras = ["test", "dash"] }
xas = { path = "../issxas", editable = true }
isstools = { path = "../isstools", editable = true }
issfactortools = { path = "../issfactortools", editable = true }

[tasks]
start = "python -m xview.xview"
dash = "python -m xview.xview_dash"
test = { cmd = "python -m pytest", env = { QT_QPA_PLATFORM = "offscreen", MPLBACKEND = "Agg" } }
build = "python -m build --no-isolation"
check = { cmd = "python -m pip check", env = { PIP_DISABLE_PIP_VERSION_CHECK = "1" } }
smoke = "python scripts/smoke_gui.py"
